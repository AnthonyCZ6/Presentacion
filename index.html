  <p class="hint">Arrastra el globo para girarlo</p>

  <script>
    /* Control por arrastre, libre en los dos ejes.

       El giro no cuelga del scroll, asi que la pagina no se desplaza: la
       unica forma de mover el globo es agarrarlo. Eso obliga a JavaScript,
       porque un arrastre no se puede leer desde CSS.

       Las transformaciones se escriben DIRECTAMENTE en los cuatro elementos
       que giran, no a traves de una propiedad personalizada heredada. Con una
       variable heredada desde body, cambiarla obligaba al navegador a
       recalcular estilo en las cientos de teselas aunque ninguna la usara.
       Asi solo se tocan cuatro nodos por fotograma. */
    (() => {
      const sistema = document.querySelector(".sistema");
      const ejes = [...document.querySelectorAll(".eje")];
      const capas = [...document.querySelectorAll(".corteza, .luces")];
      const salidaLon = document.getElementById("meridiano");
      const salidaLat = document.getElementById("paralelo");

      const INCLINACION_AXIAL = -23.44;   // la de la Tierra

      /* Hasta los polos, y ahi se para. Con 90 grados ya se alcanza cualquier
         punto de la esfera; pasar de ahi solo pondria el globo del reves.
         Antes el tope era de 14 grados porque la construccion anterior, de
         lonjas planas de polo a polo, se vaciaba al inclinarla. La malla de
         teselas no tiene ese limite. */
      const TOPE = 90;

      const POR_PIXEL_X = 0.38;           // grados de giro por pixel
      const POR_PIXEL_Y = 0.30;
      const ROCE = 0.94;                  // frenado de la inercia

      const suave = !matchMedia("(prefers-reduced-motion: reduce)").matches;

      let giro = 0;
      let inclina = -8;
      let velocidad = 0;
      let arrastrando = false;
      let ultimoX = 0;
      let ultimoY = 0;
      let pendiente = false;
      let estrenado = false;

      /* Longitud del meridiano que mira al frente. Una tesela de longitud L
         acaba en L + giro, asi que da a camara cuando L = -giro. */
      const normalizar = (a) => ((a % 360) + 540) % 360 - 180;

      const formato = (v, positivo, negativo) =>
        Math.abs(v).toFixed(1).replace(".", ",") + "\u00b0 " +
        (v >= 0 ? positivo : negativo);

      function pintar() {
        pendiente = false;
        const eje =
          "rotateZ(" + INCLINACION_AXIAL + "deg) rotateX(" + inclina.toFixed(2) + "deg)";
        for (const e of ejes) e.style.transform = eje;

        const vuelta = "rotateY(" + giro.toFixed(2) + "deg)";
        for (const c of capas) c.style.transform = vuelta;

        salidaLon.textContent = formato(normalizar(-giro), "E", "O");
        salidaLat.textContent = formato(-inclina, "N", "S");
      }

      function programar() {
        if (pendiente) return;
        pendiente = true;
        requestAnimationFrame(pintar);
      }

      function estrenar() {
        if (estrenado) return;
        estrenado = true;
        document.body.classList.add("tocado");
      }

      /* Inercia: el globo sigue girando y frena solo. Sin esto el arrastre se
         siente pegajoso, como mover una imagen en vez de un objeto. */
      function deslizar() {
        if (arrastrando) return;
        if (Math.abs(velocidad) < 0.02) { velocidad = 0; return; }
        giro += velocidad;
        velocidad *= ROCE;
        programar();
        requestAnimationFrame(deslizar);
      }

      sistema.addEventListener("pointerdown", (e) => {
        arrastrando = true;
        velocidad = 0;
        ultimoX = e.clientX;
        ultimoY = e.clientY;
        sistema.setPointerCapture(e.pointerId);
        sistema.classList.add("agarrado");
        estrenar();
      });

      sistema.addEventListener("pointermove", (e) => {
        if (!arrastrando) return;
        const dx = e.clientX - ultimoX;
        const dy = e.clientY - ultimoY;
        ultimoX = e.clientX;
        ultimoY = e.clientY;

        giro += dx * POR_PIXEL_X;
        velocidad = dx * POR_PIXEL_X;

        /* Al tirar hacia abajo el frente del globo baja y asoma el polo
           norte, que es lo que espera la mano. En rotateX eso es restar. */
        inclina = Math.max(-TOPE, Math.min(TOPE, inclina - dy * POR_PIXEL_Y));
        programar();
      });

      const soltar = (e) => {
        if (!arrastrando) return;
        arrastrando = false;
        sistema.classList.remove("agarrado");
        if (sistema.hasPointerCapture(e.pointerId)) {
          sistema.releasePointerCapture(e.pointerId);
        }
        if (suave) requestAnimationFrame(deslizar);
      };
      sistema.addEventListener("pointerup", soltar);
      sistema.addEventListener("pointercancel", soltar);

      /* Flechas del teclado: el globo es ahora un control, no una imagen, y
         tiene que poder manejarse sin raton. Misma convencion que el
         arrastre, o sea agarrar el objeto y no mover la camara. */
      sistema.addEventListener("keydown", (e) => {
        const paso = e.shiftKey ? 15 : 5;
        let usada = true;

        if (e.key === "ArrowLeft") giro -= paso;
        else if (e.key === "ArrowRight") giro += paso;
        else if (e.key === "ArrowUp") inclina = Math.min(TOPE, inclina + paso);
        else if (e.key === "ArrowDown") inclina = Math.max(-TOPE, inclina - paso);
        else usada = false;

        if (!usada) return;
        e.preventDefault();
        velocidad = 0;
        estrenar();
        programar();
      });

      pintar();
    })();
  </script>
