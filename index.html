    /* La superficie se oculta hasta que sus 334 texturas esten decodificadas,

       si ese script no llegara a cargar. */

    setTimeout(() => document.documentElement.classList.remove("cargando"), 8000);

  <header class="barra">
    <h1 class="rotulo">Mapa mundi &middot; eje a 23,44&deg;<span class="rotulo-malla"> &middot; malla de 334 teselas</span></h1>

    <div class="controles">
      <form class="buscador" id="buscador" role="search" autocomplete="off">
        <label class="oculto" for="buscar">Buscar un lugar</label>
        <input id="buscar" type="search" placeholder="Busca un lugar"
               title="Ciudad, estado, país o coordenadas como 19.4, -99.1"
               role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sugerencias"
               enterkeyhint="go" spellcheck="false">

        <button class="ir" type="submit" aria-label="Ir al lugar">

        </button>
        <p class="aviso" id="aviso" role="status"></p>
      </form>

      <nav class="herramientas" aria-label="Controles del globo">
        <button class="boton" type="button" id="b-recorrido" aria-pressed="false"

          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
        </button>
        <button class="boton icono" type="button" id="b-marcas" aria-pressed="true"
                aria-label="Nombres de ciudades, pa&iacute;ses y estados" title="Nombres de ciudades, pa&iacute;ses y estados">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 21s-6-5.3-6-10a6 6 0 0 1 12 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/></svg>
        </button>
        <button class="boton icono" type="button" id="b-inicio"
                aria-label="Volver a la vista inicial" title="Volver a la vista inicial (Inicio)">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 11l8-7 8 7"/><path d="M6.5 9.5V20h11V9.5"/></svg>
        </button>
        <button class="boton icono" type="button" id="b-pantalla" aria-pressed="false"

          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
      </nav>
    </div>
  </header>
